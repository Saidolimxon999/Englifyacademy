<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Englify — English made easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#dfe8ff;--ink:#12203a;--muted:#46557a;--primary:#2d4ef5;--on:#fff;--sun:#ffc93c;--mint:#1fb58f;--bad:#e5484d;--glass:rgba(255,255,255,.09);--gb:rgba(255,255,255,.55);--sh:0 6px 20px rgba(40,60,140,.16);--line:rgba(255,255,255,.55);--surface:rgba(255,255,255,.4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d1c;--ink:#eef2fb;--muted:#b4c0da;--primary:#7f98ff;--on:#0e1626;--glass:rgba(255,255,255,.03);--gb:rgba(255,255,255,.17);--sh:0 6px 20px rgba(0,0,0,.35);--line:rgba(255,255,255,.18);--surface:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#080d1c;--ink:#eef2fb;--muted:#b4c0da;--primary:#7f98ff;--on:#0e1626;--glass:rgba(255,255,255,.03);--gb:rgba(255,255,255,.17);--sh:0 6px 20px rgba(0,0,0,.35);--line:rgba(255,255,255,.18);--surface:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;background:radial-gradient(38% 34% at 15% 20%,#5b7bff 0,transparent 70%),radial-gradient(34% 34% at 85% 12%,#ff6fc2 0,transparent 70%),radial-gradient(40% 40% at 82% 85%,#ffc93c 0,transparent 70%),radial-gradient(44% 40% at 8% 88%,#1fb58f 0,transparent 70%);will-change:auto;animation:none}
@keyframes drift{to{transform:translate3d(4%,5%,0) scale(1.1) rotate(6deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(229,72,77,.25)}}
@media(prefers-reduced-motion:reduce){body::before,.mic.on{animation:none}}
h1,h2,h3{font-family:"Bricolage Grotesque",Onest,system-ui,sans-serif;line-height:1.1;margin:0 0 12px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}
.logo b{background:var(--sun);color:#12203a;padding:0 7px;border-radius:8px;margin-right:6px}
.pill,.box,.item,.tile,.b,.opt,.chip,input,select,nav.tab,.mc,.card{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08)}
.pill{font-weight:600;font-size:14px;padding:6px 14px;border-radius:99px}
h1{font-size:clamp(34px,8vw,56px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(24px,5vw,32px);font-weight:800}
h3{font-size:18px}
.muted,small{color:var(--muted)}
.btn{background:var(--primary);color:var(--on);border:0;border-radius:14px;padding:12px 18px;font:600 15px Onest,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(45,78,245,.35)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--gb);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row>.btn{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.tile{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:28px}.tile b{font:800 18px "Bricolage Grotesque",sans-serif}.tile small{font-size:13px}
.tile:nth-child(1){background:rgba(255,201,60,.5)}
.box{border-radius:22px;padding:18px;margin:12px 0}
.card{border-radius:26px;background:rgba(255,201,60,.72);color:#12203a;padding:24px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;width:100%;text-align:left;font:inherit;cursor:pointer}
.card.flip{background:rgba(31,181,143,.75)}
.word{font:800 clamp(36px,10vw,52px)/1 "Bricolage Grotesque",sans-serif}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chip{flex:none;color:var(--ink);border-radius:99px;padding:8px 14px;font:600 14px Onest,sans-serif;cursor:pointer}
.chip.on{background:var(--primary);color:var(--on);border-color:transparent}
.item{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;margin-bottom:10px}
.item>div{flex:1;min-width:0}.item p{margin:0;font-size:14px;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.steps i{font-style:normal;font-size:12px;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 9px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;margin:10px 0;color:var(--ink);border-radius:16px;padding:15px;font:500 16px Onest,sans-serif;cursor:pointer}
.opt.ok{background:rgba(31,181,143,.8);color:#06251c}.opt.no{background:rgba(229,72,77,.85);color:#fff}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--primary)}
.sent{font:800 24px/1.25 "Bricolage Grotesque",sans-serif;margin:10px 0}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.b{max-width:88%;padding:10px 14px;border-radius:18px}
.b.me{align-self:flex-end;background:rgba(45,78,245,.8);color:#fff}
.b em{display:block;font-style:normal;font-weight:700;margin-top:4px}
input,select{width:100%;padding:12px;border-radius:14px;color:var(--ink);font:16px Onest,sans-serif;margin:4px 0}
input::placeholder{color:var(--muted)}
.mic{width:60px;height:60px;border-radius:50%;font-size:26px;padding:0;flex:none}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
.vb{flex:none}
nav.tab{position:fixed;z-index:20;left:14px;right:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px;display:flex;justify-content:space-around;padding:3px 4px;max-width:440px;margin:0 auto}
nav.tab a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.15;font-weight:600;color:var(--muted);padding:3px 12px;border-radius:16px}
nav.tab a.on{color:var(--primary);background:rgba(255,255,255,.3)}nav.tab span{font-size:17px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,13,28,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal.on{display:flex}.mc{width:100%;max-width:720px;padding:12px;border-radius:26px}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:16px;background:#000;display:block}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}table{width:100%;border-collapse:collapse}

.wrap{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes flipin{from{opacity:.3;transform:perspective(700px) rotateX(-60deg) scale(.96)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
#app.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}#app.enter>*:nth-child(4){animation-delay:.18s}#app.enter>*:nth-child(5){animation-delay:.24s}#app.enter>*:nth-child(n+6){animation-delay:.3s}
#app.enter .tile{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter .tile:nth-child(2){animation-delay:.1s}#app.enter .tile:nth-child(3){animation-delay:.16s}#app.enter .tile:nth-child(4){animation-delay:.22s}#app.enter .tile:nth-child(5){animation-delay:.28s}#app.enter .tile:nth-child(6){animation-delay:.34s}
.card{animation:flipin .45s cubic-bezier(.2,.8,.2,1) backwards}
.opt{animation:rise .35s backwards}.opt.no{animation:shake .4s}.opt.ok{animation:pop .35s}
.btn,.chip,.opt,.tile,.item,.card,nav.tab a{transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,background .25s}
.btn:active,.chip:active,.opt:active,.tile:active,.card:active{transform:scale(.94)}nav.tab a:active{transform:scale(.88)}
@media(hover:hover){.tile:hover,.item:hover{transform:translateY(-3px)}.btn:hover{transform:translateY(-1px)}}
button,.tile{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@media(prefers-reduced-motion:reduce){.gl,.ring,.shine::after,.card,.opt,.rp,#app.enter>*,#app.enter .tile{animation:none!important}}


/* AI ustoz portreti: joyida turadi, mayin tabiiy harakatlar */
.tutorstage{overflow:hidden;isolation:isolate}
.tutorportrait{position:relative;z-index:1;height:100%;max-width:94%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;}
.tutorportrait .tutorpic{height:100%;max-width:100%;width:auto;display:block;object-fit:contain;object-position:center bottom;animation:tutorBreath 5.5s ease-in-out infinite;}
.tutorportrait.cartoon{height:94%;max-width:78%}
.tutorportrait.cartoon .tutorpic{height:100%;max-width:100%;border-radius:22px}
@keyframes tutorBreath{0%,100%{filter:drop-shadow(0 12px 16px rgba(0,0,0,.22))}50%{filter:drop-shadow(0 14px 18px rgba(0,0,0,.25))}}
.tutormouth{position:absolute;z-index:3;left:52.8%;top:35.5%;width:8.2%;height:2.8%;border-radius:50% 50% 48% 48%;background:linear-gradient(180deg,#e6a092,#d98b83);box-shadow:inset 0 -1px 1px rgba(100,20,30,.12);transform:translate(-50%,-50%) scaleY(.72);transform-origin:center;pointer-events:none}
.tutorportrait.cartoon .tutormouth{left:60%;top:61%;width:10%;height:3.5%;background:linear-gradient(180deg,#f3a49a,#d86b78)}
.tutorportrait.talking .tutormouth{background:linear-gradient(180deg,#4b1827 0 58%,#c75a70 59% 100%);height:6.2%;transform:translate(-50%,-50%) scaleY(1);animation:mouthSpeak .22s ease-in-out infinite alternate}
.tutorportrait.cartoon.talking .tutormouth{height:7.5%}
@keyframes mouthSpeak{from{transform:translate(-50%,-50%) scaleY(.55)}to{transform:translate(-50%,-50%) scaleY(1.15)}}
.tutorportrait.talking .tutorpic{animation:tutorBreath 2.4s ease-in-out infinite}
.tutorbubble{transition:opacity .2s}

/* AI ustoz ovoz va gapirish animatsiyasi */
@keyframes tutorTalk{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-3px) scale(1.012)}50%{transform:translateY(1px) scale(.995)}75%{transform:translateY(-2px) scale(1.008)}}
@keyframes bubbleTalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(139,112,255,.25)}50%{box-shadow:0 0 0 10px rgba(139,112,255,0)}}
.tutorpic.talking{animation:none!important;transform:none!important;filter:drop-shadow(0 8px 22px rgba(120,100,255,.32))}
@keyframes tutorPresence{0%,100%{transform:rotate(0deg)}50%{transform:rotate(.45deg)}}
.tutorportrait.talking{animation:tutorPresence 2.6s ease-in-out infinite;transform-origin:50% 100%}
.tutorbubble.talking{animation:none}
.voice-face{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:10px 0;border:1px solid var(--gb);border-radius:18px;background:var(--glass);box-shadow:var(--sh)}
.voice-face .face{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;font-size:27px;background:linear-gradient(135deg,rgba(151,130,255,.28),rgba(84,202,220,.22));flex:none}
.voice-face.speaking .face{animation:voicePulse .8s ease-in-out infinite,tutorTalk .34s ease-in-out infinite}
.voice-face .vstatus{font-size:12px;color:var(--muted)}
.voice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(prefers-reduced-motion:reduce){.tutorpic.talking,.tutorbubble.talking,.voice-face.speaking .face{animation:none!important}}

body.gated{overflow:hidden}
.logo{display:flex;align-items:center;gap:8px}.logo img{width:34px;height:34px;border-radius:10px;display:block}
.gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;background:radial-gradient(70% 45% at 50% -5%,rgba(120,150,255,.6),transparent 70%),radial-gradient(60% 45% at 100% 100%,rgba(170,130,255,.5),transparent 70%),radial-gradient(50% 40% at 0 90%,rgba(60,190,240,.4),transparent 70%),var(--bg);transition:opacity .45s,transform .45s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.gate.out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate[hidden],.gw[hidden]{display:none!important}
.gw{width:100%;max-width:460px;margin:0 auto;padding:22px;min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.lw{position:relative;width:min(68vw,300px);aspect-ratio:1;margin:clamp(6px,5vh,40px) auto 10px}
.gl{width:100%;height:100%;border-radius:26%;display:block;position:relative;z-index:1;box-shadow:0 26px 60px rgba(60,90,230,.38);animation:logoin 1.1s cubic-bezier(.2,.9,.3,1),fl 6s ease-in-out 1.2s infinite alternate}
.shine{position:absolute;inset:0;border-radius:26%;overflow:hidden;z-index:2;pointer-events:none}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-18deg);animation:sweep 3s ease-in-out 1.4s infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 28px rgba(110,140,255,.6),inset 0 0 20px rgba(255,255,255,.4);opacity:0;animation:ringout 1.9s ease-out forwards}
.r1{animation-delay:.55s}.r2{animation-delay:.8s}.r3{animation-delay:1.05s}
.gp{font:700 19px/1.3 "Bricolage Grotesque",Onest,sans-serif;max-width:28ch;margin:4px 0;animation:rise .7s cubic-bezier(.2,.8,.2,1) 1s backwards}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;animation:rise .7s cubic-bezier(.2,.8,.2,1) 1.25s backwards}
.feat span{border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600}
.gb{margin-top:auto;padding-top:18px;width:100%;display:flex;flex-direction:column;gap:10px;animation:rise .7s cubic-bezier(.2,.8,.2,1) 1.5s backwards}
.gb .btn{padding:15px;font-size:16px}
.hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);margin:0;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;z-index:3}
.auth{display:flex;align-items:center;gap:12px;width:100%;border-radius:18px;padding:14px;font:600 16px Onest,sans-serif;color:var(--ink);cursor:pointer;text-align:left}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 17px sans-serif;flex:none}
.ic.g{background:#fff;color:#ea4335}.ic.f{background:#1877f2;color:#fff}.ic.p{background:var(--mint);color:#06251c}
.auth,.feat span,.hint{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.55)}
@keyframes logoin{0%{opacity:0;transform:translateY(-140px) scale(.5)}55%{opacity:1;transform:translateY(8px) scale(1.04)}75%{transform:translateY(-4px) scale(.99)}100%{transform:none}}
@keyframes fl{to{transform:translateY(-8px) rotate(-1.2deg)}}
@keyframes ringout{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(2.1)}}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}

nav.tab{border-radius:999px;max-width:460px;padding:3px}
nav.tab a{flex:1;position:relative;overflow:hidden;z-index:1;border-radius:999px;padding:4px 0;font-size:10px;white-space:nowrap}
nav.tab a.on{background:none}
.ind{position:absolute;left:0;top:0;z-index:0;opacity:0;pointer-events:none;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 18px rgba(45,78,245,.28);transition:transform .5s cubic-bezier(.3,1.35,.4,1),width .5s cubic-bezier(.3,1.35,.4,1),height .3s,opacity .3s,scale .2s}
.ind.mv{animation:indpop .5s ease}
nav.tab.pr .ind{scale:.9}
@keyframes indpop{35%{scale:1.12 .84}}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(14px) scale(.97)}}
#app.enter>*{animation-name:slide}
.tile{background:rgba(255,255,255,.05)}.tile:nth-child(1){background:rgba(255,201,60,.28)}
button.tile{text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:132px;justify-content:flex-end}
a.btn{display:block;text-align:center}
.tk{border-left:4px solid var(--sun);background:linear-gradient(90deg,rgba(255,201,60,.3),var(--glass) 65%)}
.tk.late{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(229,72,77,.28),var(--glass) 65%)}
.bd{display:inline-block;background:var(--sun);color:#12203a;font:700 11px Onest,sans-serif;padding:2px 9px;border-radius:99px;margin-bottom:4px}
.sec{margin:16px 0}.sec .sh{font:800 17px "Bricolage Grotesque",sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:8px}.sec .sh b{margin-left:auto;background:var(--sun);color:#12203a;border-radius:99px;padding:1px 10px;font-size:13px}
.sec.t{padding:12px;border-radius:26px;border:1px dashed rgba(255,201,60,.9);background:rgba(255,201,60,.1)}
.code{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:.12em;font-size:18px}

html{-webkit-tap-highlight-color:transparent}button,a,.chip{touch-action:manipulation}
nav.tab{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lite body::before,.lite .ring,.lite .shine::after{animation:none}.lite nav.tab{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}.lite #app.enter>*,.lite #app.enter .tile{animation-duration:.25s}
.chatbtn,.bigt{display:flex;align-items:center;gap:14px;width:100%;margin:12px 0;padding:14px 16px;border-radius:22px;text-align:left;background:var(--glass);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.55);color:inherit;font:inherit;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.chatbtn:active,.bigt:active{transform:scale(.96)}
.chatbtn>span,.bigt>span{font-size:30px}.chatbtn b,.bigt b{font:800 18px "Bricolage Grotesque",sans-serif}.chatbtn small,.bigt small{display:block;color:var(--muted)}
.cbadge{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;border-radius:99px;min-width:24px;padding:0 8px;text-align:center;font-weight:700}.cbadge:empty{display:none}
.sc{flex:none;font:800 16px "Bricolage Grotesque",sans-serif;padding:6px 10px;border-radius:12px;background:rgba(128,128,128,.25)}
.sc.hi{background:var(--mint);color:#06251c}.sc.md{background:var(--sun);color:#12203a}.sc.lo{background:var(--bad);color:#fff}
.item.rec{align-items:flex-start}.rec audio{width:100%;height:38px;margin:8px 0}.rec .row{margin:4px 0 0}.rec input{margin:6px 0}
.fbk{background:rgba(255,201,60,.25);border-radius:12px;padding:8px 10px;color:var(--ink)!important}
.b{white-space:pre-wrap}.tip{display:block;font-style:normal;font-size:14px;margin-top:4px;opacity:.85}.typ{opacity:.6}

/* ===== Mobile AI tutor dashboard ===== */
.homehero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.42);border-radius:28px;padding:16px 14px 14px;margin:14px 0 18px;background:linear-gradient(145deg,rgba(55,75,190,.78),rgba(31,24,91,.82) 58%,rgba(115,70,190,.72));color:#fff;box-shadow:0 16px 42px rgba(35,28,120,.28),inset 0 1px 0 rgba(255,255,255,.4);}
.homehero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,255,255,.24),transparent 32%),radial-gradient(circle at 12% 90%,rgba(92,160,255,.28),transparent 38%);pointer-events:none}
.homehero>*{position:relative}.herohead{display:flex;align-items:center;justify-content:space-between;gap:8px}.herotag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)}
.herocopy{font:800 clamp(22px,6vw,30px)/1.1 "Bricolage Grotesque",sans-serif;margin:14px 0 5px;max-width:18ch}.herosub{margin:0;color:rgba(255,255,255,.82);font-size:13px}
.tutorstage{height:230px;position:relative;display:flex;align-items:flex-end;justify-content:center;margin:2px -6px 8px;overflow:hidden}.tutorstage:after{content:"";position:absolute;bottom:0;left:7%;right:7%;height:45%;border-radius:50%;background:radial-gradient(ellipse,rgba(160,140,255,.42),transparent 70%);pointer-events:none}
.tutorpic{position:relative;z-index:1;display:block;height:100%;max-width:94%;width:auto;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 12px 16px rgba(0,0,0,.22));transition:opacity .2s,transform .3s}.tutorpic.cartoon{height:94%;max-width:78%;border-radius:22px;mix-blend-mode:normal}
.tutorbubble{position:absolute;z-index:2;top:10px;right:2px;max-width:68%;padding:10px 12px;border-radius:17px 17px 5px 17px;background:rgba(255,255,255,.92);color:#1d2462;font-size:13px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.16)}
/* Tutor portrait layout fixes: speech bubble is separate, image stays centered on phones */
.tutorbubble{position:relative!important;inset:auto!important;display:table;width:auto;max-width:100%;margin:12px auto 8px;padding:10px 14px;text-align:center;background:rgba(18,24,75,.72)!important;color:#fff!important;border:1px solid rgba(255,255,255,.28);border-radius:16px!important;font-size:13px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.16);backdrop-filter:blur(12px)}
.tutorstage{height:260px!important;min-height:230px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 88%,rgba(154,133,255,.24),transparent 66%);}
.tutorportrait{position:relative!important;height:100%!important;width:auto;max-width:94%;aspect-ratio:520/525;display:flex;align-items:flex-end;justify-content:center;flex:none;overflow:visible}
.tutorportrait .tutorpic{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;object-fit:contain!important;object-position:center bottom!important;border-radius:0!important;background:transparent!important;mix-blend-mode:normal!important;filter:drop-shadow(0 9px 15px rgba(5,8,40,.24))}
.tutorportrait.cartoon{aspect-ratio:1/1;max-width:78%;height:94%!important}
.tutorportrait.cartoon .tutorpic{border-radius:0!important}
.tutormouth{left:54%!important;top:36.4%!important;width:7.6%!important;height:2.5%!important;opacity:.12;background:#642b39!important;border-radius:45% 45% 55% 55%!important;box-shadow:inset 0 -2px 0 rgba(230,125,143,.9)!important;transform:translate(-50%,-50%) scaleY(.65);}
.tutorportrait.talking .tutormouth{opacity:.92;height:4.6%!important;animation:mouthSpeak .19s ease-in-out infinite alternate!important}
.tutorportrait.cartoon .tutormouth{left:60%!important;top:61%!important;width:10%!important;height:3.5%!important}
.tutorportrait.cartoon.talking .tutormouth{height:7%!important}

var FS_ARRAY_KEY="englifyFirestoreNestedArray";
function fsEncode(value){
  if(Array.isArray(value)){
    return value.map(function(item){
      return Array.isArray(item)?(function(){var o={};o[FS_ARRAY_KEY]=fsEncode(item);return o;})():fsEncode(item);
    });
  }
  if(value&&typeof value==="object"){
    var out={};
    Object.keys(value).forEach(function(k){out[k]=fsEncode(value[k]);});
    return out;
  }
  return value;
}
function fsDecode(value){
  if(Array.isArray(value))return value.map(fsDecode);
  if(value&&typeof value==="object"){
    var keys=Object.keys(value);
    if(keys.length===1&&keys[0]===FS_ARRAY_KEY)return fsDecode(value[FS_ARRAY_KEY]);
    var out={};
    keys.forEach(function(k){out[k]=fsDecode(value[k]);});
    return out;
  }
  return value;
}
